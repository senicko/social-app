# Bluesky social-app login against the local mock PDS.
#
# Recorded live on ios-remote. Replay from a fresh install:
#   argent flow run login --device <udid> --platform ios
#
# Requires Metro on :8081, mock PDS on :3000, and ARGENT_SECRET_MOCK_PASSWORD
# (or MOCK_PASSWORD in .argent/secrets.env).
#
# ios-remote has no runner UI tree. Selector await/idle/type/tap cannot resolve,
# live await-ui-element is unsupported, and paste has no clipboard transport.
# This file keeps the live-recorded coordinate taps and keyboard steps.
# Coordinate taps pass without proving they landed; verify the Following feed
# after replay. First-install prompts (Open in Bluesky, Expo intro, keyboard
# tutorial, notifications, Save Password, Age Assurance, email verify) assume
# a new simulator plus a reinstall.
steps:
  - echo: Restart Bluesky. Expect the Expo development client
  - launch: xyz.blueskyweb.app
  - echo: Wait for the Expo launcher to appear
  - wait: 2000

  - echo: On Expo launcher. Open the Metro development client URL
  - tool: open-url
    args:
      url: exp+social-app-demo://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  - echo: Wait for the Open in Bluesky system prompt
  - wait: 3000

  - echo: System asks Open in Bluesky. Tap Open
  - tap: { x: 0.684, y: 0.543 }
  - echo: Wait for the first JS bundle and Expo developer-menu intro
  - wait: 25000

  - echo: Expo developer-menu intro is visible. Tap Continue
  - tap: { x: 0.5, y: 0.914 }
  - echo: Wait for the developer menu after Continue
  - wait: 1500

  - echo: Expo developer menu is open. Tap Close
  - tap: { x: 0.899, y: 0.479 }
  - echo: Wait for the logged-out splash
  - wait: 2000

  - echo: On logged-out splash. Tap Sign in
  - tap: { x: 0.501, y: 0.927 }
  - echo: Wait for the sign-in form
  - wait: 2000

  - echo: Keyboard swipe tutorial covers the form on a new simulator. Tap Continue
  - tap: { x: 0.5, y: 0.949 }
  - echo: Wait for the tutorial to dismiss
  - wait: 1000

  - echo: On Sign in. Tap Change hosting provider
  - tap: { x: 0.5, y: 0.588 }
  - echo: Wait for the hosting provider sheet
  - wait: 1500

  - echo: Hosting provider sheet is open. Tap Manual
  - tap: { x: 0.707, y: 0.72 }
  - echo: Wait for the Manual server field
  - wait: 1000

  - echo: Manual tab is selected. Tap the server address field
  - tap: { x: 0.529, y: 0.801 }
  - echo: Server field is focused. Type the mock PDS URL
  - tool: keyboard
    args:
      text: 'http://localhost:3000'
      delayMs: 40
  - echo: Mock PDS URL is entered. Tap Done
  - tap: { x: 0.5, y: 0.573 }
  - echo: Wait for the hosting sheet to close
  - wait: 1500

  - echo: Hosting provider is localhost:3000. Tap the username field
  - tap: { x: 0.53, y: 0.25 }
  - echo: Username field is focused. Type alice.test
  - tool: keyboard
    args:
      text: alice.test
      delayMs: 40

  - echo: Username is entered. Tap the password field
  - tap: { x: 0.53, y: 0.343 }
  - echo: Password field is focused. Type the mock password and submit
  - tool: run-sequence
    args:
      steps:
        - tool: keyboard
          args:
            text: '{{secret:MOCK_PASSWORD}}'
            delayMs: 40
        - tool: keyboard
          args:
            key: enter
  - echo: Wait for first-install prompts after submit
  - wait: 4000

  - echo: iOS notifications prompt is visible. Tap Don't Allow
  - tap: { x: 0.316, y: 0.593 }
  - echo: Wait for the Save Password prompt
  - wait: 1500

  - echo: iOS Save Password prompt is visible. Tap Not Now
  - tap: { x: 0.316, y: 0.626 }
  - echo: Wait for the Age Assurance screen
  - wait: 1500

  - echo: Age Assurance screen is visible. Tap Add your birthdate
  - tap: { x: 0.501, y: 0.406 }
  - echo: Wait for the birthdate sheet
  - wait: 1500

  - echo: Birthdate sheet is open with the default date. Tap Save
  - tap: { x: 0.5, y: 0.941 }
  - echo: Wait for the email verification sheet
  - wait: 3000

  - echo: Email verification sheet is visible. Tap Maybe later
  - tap: { x: 0.5, y: 0.941 }
  - echo: Wait for the Following feed
  - wait: 2000

  - echo: On the Following feed. Login succeeded
  - tool: screenshot
